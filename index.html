<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BadvelNet Live</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    html,body,#map { height:100%; margin:0; }
    .pin-online  { background:#22c55e; }
    .pin-offline { background:#ef4444; }
    .leaflet-marker-icon { border-radius:50%; border:2px solid #fff; }
  </style>
</head>

  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal) {
  await OneSignal.init({
    appId: "1ac38f19-3b6d-4e71-a7e4-9654b8c374ef",
    notifyButton: { enable: true },
    allowLocalhostAsSecureOrigin: true // for testing
  });
  await OneSignal.Slidedown.promptPush();   // ask user to subscribe
});
</script>

<script>
OneSignalDeferred.push(async function(OneSignal) {
  OneSignal.User.PushSubscription.addEventListener("change", async (event) => {
    const id = event.current.id;
    if (!id) return;
    const email = prompt("Enter your email (for subscriber list):");
    if (!email) return;
    await fetch("YOUR_APPS_SCRIPT_WEBAPP_URL", {
      method: "POST",
      body: JSON.stringify({ action: "subscribe", email, playerId: id })
    });
  });
});
</script>

  
  <body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
// Your specific live Google Apps Script API URL
const API = 'https://script.google.com/macros/s/AKfycby8m1WiQJ4OIz13vqExR23o9qbaILk5a2wocEMz8F-0os_28kLzcL2fXww1aVUSj-FpKw/exec';
const map = L.map('map').setView([14.735, 79.060], 14); // Centered roughly on Badvel
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

let markers = {};

async function refresh() {
  const res = await fetch(`${API}?action=hosts`);
  const hosts = await res.json();

  hosts.forEach(h => {
    const color = h.status === 'Online' ? '#22c55e' : '#ef4444';
    const icon = L.divIcon({
      className: 'leaflet-marker-icon',
      html: `<div style="width:14px;height:14px;border-radius:50%;
             background:${color};border:2px solid #fff;
             box-shadow:0 0 6px rgba(0,0,0,.4)"></div>`,
      iconSize: [18,18]
    });

    if (markers[h.name]) {
      markers[h.name].setIcon(icon);
      markers[h.name].setPopupContent(popup(h));
    } else {
      markers[h.name] = L.marker([h.lat, h.lon], { icon })
        .addTo(map)
        .bindPopup(popup(h));
    }
  });
}

function popup(h) {
  return `<b>${h.name}</b><br>
    Status: <b style="color:${h.status==='Online'?'green':'red'}">${h.status}</b><br>
    Last seen: ${new Date(h.last_seen).toLocaleString()}<br>
    <a href="https://www.google.com/maps?q=${h.lat},${h.lon}" target="_blank">Navigate</a>`;
}

refresh();
setInterval(refresh, 30000);  // Auto-refreshes every 30 seconds
</script>
</body>
</html>
